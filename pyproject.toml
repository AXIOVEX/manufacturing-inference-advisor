[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "manufacturing-inference-advisor"
version = "0.1.0"
description = "Evidence-aware manufacturing inference infrastructure advisor MCP server"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "mcp>=2,<3",
  "pydantic>=2.12,<3",
  "PyYAML>=6.0.3,<7",
  "rich>=14,<15",
]

[project.optional-dependencies]
dev = [
  "applied-epistemic-engineering==1.0.2",
  "mypy>=1.19,<3",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.13,<1",
]

[project.scripts]
inference-advisor-mcp = "inference_advisor.server:main"
inference-advisor = "inference_advisor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/inference_advisor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["inference_advisor"]

