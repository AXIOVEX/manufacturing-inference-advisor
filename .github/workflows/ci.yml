name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install uv==0.10.0
      - run: uv sync --frozen --extra dev
      - run: uv run python scripts/verify_extensions.py
      - run: uv run pytest --cov=inference_advisor --cov-report=term-missing --cov-fail-under=85
      - run: uv run ruff check src tests scripts
      - run: uv run mypy src/inference_advisor

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: docker build --target ci -t manufacturing-inference-advisor:ci .
      - run: >-
          docker run --rm --read-only --tmpfs /tmp
          -e COVERAGE_FILE=/tmp/.coverage
          -e MYPY_CACHE_DIR=/tmp/mypy
          -e RUFF_CACHE_DIR=/tmp/ruff
          manufacturing-inference-advisor:ci
